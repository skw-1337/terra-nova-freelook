; Terra Nova Freelook settings
; mouse sensitivity (heading / pitch units per mouse count)
sensitivity_x = 12
sensitivity_y = 8
; 1 = invert vertical look
invert_y = 0
; toggle key as a PHYSICAL key scancode (hex). 15 = Y (QWERTY/AZERTY), 2C = Z on QWERTZ,
; 29 = key left of 1, 3B..44 = F1..F10, 57/58 = F11/F12
toggle_scancode = 15
; 0 = no beeps
sound = 1
